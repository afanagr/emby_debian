name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: debian:trixie
    steps:
      - name: Install git
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates

      - uses: actions/checkout@v4

      - name: Install checks
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            kpackagetool6 plasma-desktoptheme qt6-declarative-dev-tools

      - name: Run checks
        run: ./scripts/check.sh
